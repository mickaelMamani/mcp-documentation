# Retrieval benchmark question set (ARCHITECTURE §9). Versioned with the server: any change to the
# analyzers, boosts, synonyms, tool descriptions or doc format must be accompanied by its result.
#
# kind:
#   intent        the user describes a task, not an endpoint         -> search_endpoints
#   parameter     the user asks about one field of one endpoint      -> search_endpoints (+ get_endpoint)
#   example       the user wants a code sample                       -> search_endpoints
#   crosscutting  no single endpoint answers it                      -> search_docs
#
# expected          operationIds accepted in the top 3 of search_endpoints.
# expected_chunk    section that get_endpoint must return for a parameter question.
# expected_sections breadcrumb fragments accepted in the top 3 of search_docs.
#
# French questions are reformulated by the fixed FR -> EN table of FrenchToEnglish.cs, which
# simulates what the client LLM does before calling a tool.

